server {
    listen 80;
    server_name localhost; # Replace with your domain

    # ── Frontend SPA (static files) ────────────────────
    root /var/www/trumpet/Frontend/dist;
    index index.html;

    # ── PHP API ─────────────────────────────────────────
    location /api/ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/trumpet/Backend/public/index.php;
        fastcgi_param PATH_INFO       $uri;
        include fastcgi_params;
    }

    # ── Media (local fallback only — redirect in PHP when Azure configured) ─
    location /media/ {
        alias /var/www/trumpet/resources/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
