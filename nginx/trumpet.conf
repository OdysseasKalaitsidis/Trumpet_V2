server {
    listen 80;
    server_name trumpetdemo.duckdns.org;

    # ── Frontend SPA (static files) ────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── PHP API ─────────────────────────────────────────
    location /api/ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/trumpet/Backend/public/index.php;
        fastcgi_param PATH_INFO       $uri;
        include fastcgi_params;
    }

    # ── Media (local fallback only — redirect in PHP when Azure configured) ─
    location /media/ {
        alias /var/www/trumpet/resources/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
