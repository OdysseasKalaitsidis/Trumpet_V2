version: "3.9"

services:
  backend:
    build:
      context: ./TrumpetPython
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      - DATABASE_URL=sqlite:////data/trumpet.db
      - ALLOWED_ORIGINS=http://localhost
    volumes:
      - ./data/database:/data
      - ./resources:/app/resources:ro

  frontend:
    build:
      context: ./Trumpet.Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend
